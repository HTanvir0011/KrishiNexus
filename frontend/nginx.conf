# Production equivalent of the Vite dev proxy in vite.config.ts: same-origin API prefixes, /api rewrite and /ws upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream knx_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # Keep this list in step with BACKEND_PREFIXES in vite.config.ts; openapi.json lets /api/docs load its schema.
    location ~ ^/(mcp|rag|edge|agents|automation|guardrails|optimization|prompts|evals|health|openapi\.json)(/|$) {
        proxy_pass http://knx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP Streamable HTTP answers with text/event-stream; stream it instead of buffering.
        proxy_buffering off;
        # The 100-case regression suite and full orchestrations can run for minutes.
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://knx_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://knx_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/, /docs and #section anchors) all load the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
