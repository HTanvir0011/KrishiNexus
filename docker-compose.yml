# KrishiNexus OS: backend (FastAPI :8000) + frontend (nginx :5173 on the host) + optional local Ollama.
#   docker compose up --build                          -> backend + frontend, no GPU or API keys needed
#   docker compose --profile local-llm up --build      -> also Ollama on :11434 and a one-shot model pull
# Backend settings come from backend/.env when present (see backend/.env.example).
name: krishinexus-os

services:
  backend:
    build:
      context: ./backend
      args:
        PYTHON_VERSION: "3.14"
    image: krishinexus-os/backend:0.1.0
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Service name of the optional Ollama container; when it is not running the edge node falls back offline.
      KNX_OLLAMA_HOST: ${KNX_OLLAMA_HOST:-http://ollama:11434}
    ports:
      - "${KNX_BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-state:/app/.state
    # Health comes from the image's HEALTHCHECK (GET /health); the frontend waits for it.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NODE_VERSION: "24"
    image: krishinexus-os/frontend:0.1.0
    ports:
      - "${KNX_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    profiles: ["local-llm"]
    ports:
      - "${KNX_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    restart: unless-stopped

  # Pulls the two quantised tags the edge node requests (edge_node/ollama_local.LOCAL_MODELS), about 6.7 GB in total.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5:7b-instruct-q4_K_M && ollama pull llama3.2:3b-instruct-q4_K_M"]
    restart: "no"

volumes:
  backend-state:
  ollama-models:
