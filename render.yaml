# Render Blueprint: the KrishiNexus OS hosted demo as one free web service, built from deploy/cloudrun/Dockerfile
# (frontend + API on one origin, serve.py). Render dashboard: New > Blueprint > connect this repository > Deploy Blueprint.
# Steps, limits and checks: docs/deployment.md.
services:
  - type: web
    name: krishinexus-os
    runtime: docker
    plan: free
    region: singapore # nearest Render region to Dhaka
    dockerfilePath: ./deploy/cloudrun/Dockerfile
    dockerContext: . # Render's own checkout of the deployed commit; .dockerignore keeps the context to what the image needs
    healthCheckPath: /health
    domains:
      - tanvir.health # DNS at Porkbun: ALIAS tanvir.health and CNAME www, both to krishinexus-os.onrender.com
      - www.tanvir.health
    autoDeployTrigger: commit # every push to main redeploys
    envVars:
      # A stable random key, so session tokens and signed receipts survive the free service sleeping and waking.
      - key: KNX_RECEIPT_SIGNING_KEY
        generateValue: true
      # The admin password on the public site (quick login and the demo password don't open admin accounts there).
      # Render generates it; read or change it in the service's Environment tab.
      - key: KNX_ADMIN_PASSWORD
        generateValue: true
